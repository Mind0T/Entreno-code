  <script>
  (function(){try{var t=localStorage.getItem("irvin.tema");if(t!=="claro"&&t!=="oscuro"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"claro":"oscuro";}document.documentElement.setAttribute("data-tema",t);}catch(e){document.documentElement.setAttribute("data-tema","oscuro");}})();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,600;0,700;0,800;0,900;1,500&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>

  <!-- Header global (mismo que irvingsoriano.com) -->

    <a class="brand" href="https://irvingsoriano.com" aria-label="Irving Soriano · Inicio">
      <img id="logoImg" class="logo-full" src="assets/logo-wordmark.png" alt="Irving Soriano">
    </a>
    <nav class="nav"><div class="seg2" id="segnav">
      <a href="https://irvingsoriano.com">Inicio</a>
      <a href="https://irvingsoriano.com/perfil">Acerca de mí</a>
      <a href="#/inicio" aria-current="page">Learning Zone</a>
      <a href="https://irvingsoriano.com/cursos">Comunidad</a>
    </div></nav>
    <div class="head-right">
      <button class="theme-tog" id="themeTog" type="button" aria-label="Cambiar tema">
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      </button>
      <span class="lang" role="group" aria-label="Idioma"><button data-lang="es" type="button">ES</button><button data-lang="en" type="button">EN</button></span>
      <button class="burger" id="burger" type="button" aria-label="Menú" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>

  <script>
  /* idioma + tema del header (compartido con el hub) + menú móvil */
  (function(){
    var lang="es"; try{ lang=localStorage.getItem("irvin.lang")==="en"?"en":"es"; }catch(e){}
    document.querySelectorAll(".lang [data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang===lang)); });
    var langBox=document.querySelector(".lang");
    if(langBox) langBox.addEventListener("click", function(e){ var b=e.target.closest("[data-lang]"); if(!b) return;
      try{ localStorage.setItem("irvin.lang", b.dataset.lang); }catch(_){} location.reload(); });
    var burger=document.getElementById("burger"), seg=document.getElementById("segnav");
    if(burger&&seg) burger.addEventListener("click", function(){ var o=seg.classList.toggle("open"); burger.setAttribute("aria-expanded", String(o)); });
    // tema claro/oscuro
    function tema(){ return document.documentElement.getAttribute("data-tema")==="claro"?"claro":"oscuro"; }
    function aplicar(t){ document.documentElement.setAttribute("data-tema", t); var li=document.getElementById("logoImg"); if(li) li.src = t==="claro"?"assets/logo-wordmark-dark.png":"assets/logo-wordmark.png"; window.TEMA=t; try{ window.dispatchEvent(new CustomEvent("temachange",{detail:t})); }catch(_){}}
    aplicar(tema());
    var tog=document.getElementById("themeTog");
    if(tog) tog.addEventListener("click", function(){ var t=tema()==="claro"?"oscuro":"claro"; try{ localStorage.setItem("irvin.tema", t); }catch(_){} aplicar(t); });
  })();
  </script>
