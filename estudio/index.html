<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio · Irvin Soriano</title>
  <meta name="description" content="Pruebas de escritorio animadas en C: ordenamiento, pilas, colas, memoria dinámica y dobles apuntadores.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script>try{if(localStorage.getItem("estudio.lateral")==="oculto")document.documentElement.classList.add("lateral-colapsado");}catch(e){}</script>
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <a class="sr-only" href="#contenido">Saltar al contenido</a>

  <!-- Header global del ecosistema irvingsoriano.com -->
  <header class="eco-top">
    <button type="button" class="eco-colapsar" id="ecoColapsar" aria-label="Mostrar u ocultar los temas" title="Mostrar u ocultar los temas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Temas</span>
    </button>
    <a class="eco-marca" href="https://irvingsoriano.com" title="Ir al inicio de irvingsoriano.com">
      <img src="assets/logo.png" width="34" height="34" alt="">
      <span class="eco-txt"><b>Irvin Soriano</b><em>Estudio · irvingsoriano.com</em></span>
    </a>
    <nav class="eco-nav" aria-label="Ecosistema">
      <a href="https://irvingsoriano.com">Hub</a>
      <a href="https://tablero.irvingsoriano.com">Tablero</a>
      <a class="on" href="#/inicio">Estudio</a>
    </nav>
  </header>

  <div id="app-raiz"></div>
  <noscript><p style="padding:2rem">Esta página necesita JavaScript para mostrar las animaciones.</p></noscript>

  <script src="js/nucleo.js"></script>
  <script src="js/datos/fuentes.js"></script>
  <script src="js/jugador.js"></script>
  <script src="js/vistas.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modulos/ordenamiento-trazas.js"></script>
  <script src="js/modulos/trazas-pila-estatica.js"></script>
  <script src="js/modulos/trazas-pila-dinamica.js"></script>
  <script src="js/modulos/trazas-colas.js"></script>
  <script src="js/contenido/ordenamiento.js"></script>
  <script src="js/contenido/pilas.js"></script>
  <script src="js/contenido/pila-dinamica.js"></script>
  <script src="js/contenido/infija.js"></script>
  <script src="js/contenido/colas.js"></script>
  <script src="js/contenido/busqueda.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fondo.js"></script>
  <script>
  (function(){
    var btn=document.getElementById("ecoColapsar"), r=document.documentElement;
    function sync(){ var off=r.classList.contains("lateral-colapsado"); if(btn) btn.setAttribute("aria-pressed", String(off)); }
    if(btn){ btn.addEventListener("click", function(){
      var off=r.classList.toggle("lateral-colapsado");
      try{ localStorage.setItem("estudio.lateral", off?"oculto":"visible"); }catch(e){}
      sync();
    }); }
    sync();
  })();
  </script>
</body>
</html>
